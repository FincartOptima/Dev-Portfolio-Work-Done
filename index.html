<title>Fincart Optima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#ffffff;
    --sidebar:#f7f7f5;
    --surface:#ffffff;
    --surface-sunken:#f2f2ef;
    --surface-hover:#ececE7;
    --line:#e2e1da;
    --line-strong:#cfcdc2;
    --text:#1c1d1a;
    --text-dim:#5a5c56;
    --text-faint:#8d8f87;
    --gold:#96650f;
    --gold-soft:#7a5209;
    --gold-fill:#f7ead0;
    --signal:#2c53c4;
    --gain:#187a51;
    --gain-fill:#e1f3ea;
    --loss:#b23751;
    --loss-fill:#fbe8ec;
    --violet:#6247b8;
    --slate:#54687a;

    --font-display:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
    --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace;

    --sidebar-w:296px;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-fill);color:var(--gold-soft);}

  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;}
  p{margin:0;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;}

  .mono{font-family:var(--font-mono);}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- layout shell ---------- */
  .shell{display:flex;min-height:100vh;}

  .navtoggle{
    display:none;
    position:fixed;top:16px;left:16px;z-index:40;
    width:40px;height:40px;border-radius:8px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--text);align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 8px rgba(20,18,10,.08);
  }
  .navtoggle span, .navtoggle span::before, .navtoggle span::after{
    content:"";display:block;width:16px;height:1.5px;background:var(--text);position:relative;
  }
  .navtoggle span::before{position:absolute;top:-5px;}
  .navtoggle span::after{position:absolute;top:5px;}

  /* ---------- ledger sidebar ---------- */
  .ledger{
    width:var(--sidebar-w);flex:none;
    position:fixed;top:0;left:0;bottom:0;
    background:var(--sidebar);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    z-index:30;
  }
  .ledger-brand{
    padding:28px 26px 18px;
    border-bottom:1px solid var(--line);
  }
  .ledger-eyebrow{
    font-size:10.5px;letter-spacing:.14em;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px;font-weight:600;
  }
  .ledger-brand h1{font-size:24px;line-height:1.15;color:var(--text);}
  .ledger-byline{margin-top:8px;font-size:12px;color:var(--text-faint);}

  .ledger-scroll{flex:1;overflow-y:auto;padding:6px 0 18px;}
  .ledger-act{padding:16px 26px 6px;font-size:10px;letter-spacing:.13em;color:var(--text-faint);text-transform:uppercase;}
  .ledger-list{list-style:none;margin:0;padding:0;}
  .ledger-item{}
  .ledger-link{
    display:flex;align-items:baseline;gap:11px;
    padding:7px 26px 7px 22px;
    border-left:2px solid transparent;
    color:var(--text-dim);text-decoration:none;
    font-size:13.5px;line-height:1.3;
    cursor:pointer;
  }
  .ledger-link:hover{color:var(--text);background:var(--surface-hover);}
  .ledger-idx{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);width:16px;flex:none;}
  .ledger-item.active .ledger-link{
    border-left-color:var(--gold);
    color:var(--text);
    background:var(--surface-hover);
    font-weight:500;
  }
  .ledger-item.active .ledger-idx{color:var(--gold);}

  .ledger-foot{
    padding:16px 26px 22px;border-top:1px solid var(--line);
  }
  .ledger-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-bottom:8px;}
  .ledger-progress-track{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .ledger-progress-fill{height:100%;width:0%;background:var(--gold);transition:width .25s ease;}

  /* ---------- deck ---------- */
  .deck{
    margin-left:var(--sidebar-w);
    flex:1;
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y proximity;
  }
  .page{
    min-height:100svh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    padding:78px 72px 64px;
    display:flex;flex-direction:column;justify-content:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .page-inner{max-width:1180px;margin:0 auto;width:100%;}

  .eyebrow-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .eyebrow{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;
    color:var(--text-faint);text-transform:uppercase;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .status-dot.gold{background:var(--gold);}
  .status-dot.signal{background:var(--signal);}
  .status-dot.violet{background:var(--violet);}
  .status-dot.gain{background:var(--gain);}
  .status-dot.slate{background:var(--slate);}
  .status-dot.faint{background:var(--text-faint);}

  .headline{font-size:clamp(28px,3.1vw,42px);line-height:1.12;color:var(--text);max-width:17ch;}
  .lede{margin-top:16px;font-size:16px;line-height:1.6;color:var(--text-dim);max-width:52ch;}

  .page-body{
    margin-top:44px;
    display:grid;grid-template-columns:0.92fr 1.08fr;gap:56px;align-items:start;
  }
  .page.flip .page-body{grid-template-columns:1.08fr 0.92fr;}
  .page.flip .narrative{order:2;}
  .page.flip .exhibit-col{order:1;}

  /* ---------- narrative ---------- */
  .beats{border-top:1px solid var(--line);}
  .beat{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);}
  .beat-mark{flex:none;width:5px;height:5px;border-radius:50%;background:var(--gold);position:relative;top:-1px;}
  .beat-label{
    flex:none;width:88px;
    font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
    color:var(--text-faint);text-transform:uppercase;font-weight:600;
  }
  .beat p{flex:1;font-size:14.5px;line-height:1.5;color:var(--text-dim);max-width:44ch;}
  .beat b{color:var(--text);font-weight:600;}

  .stat-ticker{
    display:flex;flex-wrap:wrap;gap:0;
    margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .stat{
    flex:1 1 120px;padding:16px 20px 16px 0;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat-val{font-family:var(--font-mono);font-size:23px;font-weight:600;letter-spacing:-.01em;}
  .stat-val.gold{color:var(--gold);}
  .stat-val.gain{color:var(--gain);}
  .stat-val.loss{color:var(--loss);}
  .stat-val.neutral{color:var(--text);}
  .stat-lbl{margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--text-faint);max-width:20ch;}

  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;align-items:center;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.03em;
    padding:11px 18px;border-radius:7px;text-decoration:none;cursor:pointer;
    border:1px solid transparent;transition:transform .15s ease,background .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--text);color:var(--paper);font-weight:600;}
  .btn-primary:hover{background:#000;}
  .btn-outline{border-color:var(--line-strong);color:var(--text-dim);}
  .btn-outline:hover{border-color:var(--text-faint);color:var(--text);background:var(--surface-hover);}
  .cta-note{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .cta-note.warn{color:var(--loss);}

  /* ---------- exhibits ---------- */
  .exhibit-col{display:flex;flex-direction:column;gap:18px;}
  .exhibit-group{display:flex;flex-direction:column;gap:22px;}
  .exhibit-group.pair{flex-direction:row;gap:18px;}
  .exhibit{flex:1;min-width:0;}
  .exhibit-frame{
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:var(--surface);
    box-shadow:0 1px 2px rgba(30,26,10,.04), 0 16px 40px -28px rgba(30,26,10,.25);
  }
  .exhibit-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 13px;border-bottom:1px solid var(--line);
    background:var(--surface-sunken);
  }
  .exhibit-bar-left{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;}
  .exhibit-bar-left .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .dot.live{background:var(--gain);box-shadow:0 0 0 3px var(--gain-fill);animation:pulse 2.6s ease-in-out infinite;}
  .dot.static{background:var(--text-faint);}
  .dot.restricted{background:var(--loss);}
  .dot.draft{background:var(--violet);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--gain-fill);}50%{box-shadow:0 0 0 5px transparent;}}
  .exhibit-bar-left .word.live{color:var(--gain);}
  .exhibit-bar-left .word.static{color:var(--text-faint);}
  .exhibit-bar-left .word.restricted{color:var(--loss);}
  .exhibit-bar-left .word.draft{color:var(--violet);}
  .exhibit-bar-right{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%;}
  .exhibit-shot{background:#000;}
  .exhibit-shot img{width:100%;cursor:zoom-in;}
  .exhibit-caption{margin-top:9px;font-size:12.5px;color:var(--text-faint);line-height:1.5;padding:0 2px;}

  /* ---------- closing ---------- */
  .closing h2{font-size:clamp(32px,4.2vw,52px);color:var(--text);max-width:18ch;}
  .closing-lede{margin-top:18px;font-size:16px;line-height:1.65;color:var(--text-dim);max-width:56ch;}
  .closing-foot{margin-top:48px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;font-family:var(--font-mono);font-size:12px;color:var(--text-faint);border-top:1px solid var(--line);padding-top:20px;}

  /* ---------- floating controls ---------- */
  .floatnav{
    position:fixed;right:26px;bottom:26px;z-index:35;
    display:flex;flex-direction:column;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;
    box-shadow:0 4px 16px rgba(20,18,10,.08);
  }
  .floatnav button{
    width:34px;height:34px;border-radius:6px;border:none;background:transparent;color:var(--text-dim);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .floatnav button:hover{background:var(--surface-hover);color:var(--text);}
  .floatnav .fn-count{font-family:var(--font-mono);font-size:10px;text-align:center;color:var(--text-faint);padding:2px 0;}

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;background:rgba(20,18,12,.85);
    display:none;align-items:center;justify-content:center;padding:48px;z-index:60;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
  .lightbox-close{
    position:fixed;top:24px;right:28px;width:40px;height:40px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
  }

  /* ================= new interactive components ================= */

  /* console (fund selector) */
  .console{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(30,26,10,.04), 0 16px 40px -28px rgba(30,26,10,.25);overflow:hidden;}
  .console-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--surface-sunken);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .console-body{padding:22px;}
  .console-controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
  .console-controls-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;}
  .year-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .year-tab{font-family:var(--font-mono);font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--text-dim);cursor:pointer;}
  .year-tab:hover{background:var(--surface-hover);}
  .year-tab.active{background:var(--text);color:var(--paper);border-color:var(--text);}
  .run-btn{margin-left:auto;font-family:var(--font-mono);font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:7px;background:var(--gold);color:#fff;border:none;cursor:pointer;}
  .run-btn:hover{background:var(--gold-soft);}
  .run-btn:disabled{opacity:.55;cursor:default;}
  .console-status{margin-top:16px;font-family:var(--font-mono);font-size:12px;color:var(--gold);min-height:18px;}
  .console-results{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .result-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:10px;}
  .hit-badge{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:var(--gain-fill);color:var(--gain);}
  .fund-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;font-size:12.5px;}
  .fund-row + .fund-row{margin-top:2px;}
  .fund-row.hit{background:var(--gain-fill);}
  .fund-rank{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:16px;flex:none;}
  .fund-name{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fund-ret{font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none;}
  .fund-ret.pos{color:var(--gain);}
  .fund-ret.neg{color:var(--loss);}
  .fund-check{width:14px;flex:none;color:var(--gain);font-size:12px;}
  .console-summary{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--text-dim);}
  .universe-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .universe-head h4{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text);}
  .universe-head h4 em{font-style:normal;color:var(--gold);}
  .universe-count{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
  .universe-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:340px;overflow-y:auto;}
  .universe-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);font-size:12px;color:var(--text-dim);}
  .universe-q{flex:none;width:15px;height:15px;border-radius:50%;background:var(--gold-fill);color:var(--gold);font-family:var(--font-mono);font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:600;}
  .universe-cta{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .results-back{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);background:none;border:none;cursor:pointer;padding:0;margin-bottom:12px;text-decoration:underline;text-underline-offset:2px;}
  .results-back:hover{color:var(--text);}
  .console-summary b{color:var(--text);font-family:var(--font-mono);}

  /* macro grid */
  .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .macro-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;box-shadow:0 1px 2px rgba(30,26,10,.04);}
  .macro-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;color:var(--text);}
  .macro-delta{font-family:var(--font-mono);font-size:11.5px;font-weight:600;}
  .macro-delta.up{color:var(--gain);}
  .macro-delta.down{color:var(--loss);}
  .macro-card svg{width:100%;height:44px;margin-top:8px;display:block;}
  .macro-card-note{margin-top:8px;font-size:11.5px;line-height:1.5;color:var(--text-faint);}
  .macro-conclusion{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .macro-conclusion b{color:var(--text);font-weight:600;}
  .signal-list{list-style:none;margin:10px 0 0;padding:0;}
  .signal-list li{position:relative;padding:6px 0 6px 16px;font-size:13.5px;line-height:1.45;color:var(--text-dim);border-bottom:1px solid var(--line);}
  .signal-list li:last-child{border-bottom:none;}
  .signal-list li::before{content:"";position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:var(--gold);}
  .signal-summary{margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--text-faint);font-style:normal;}

  /* investment simulator */
  .sim{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(30,26,10,.04), 0 16px 40px -28px rgba(30,26,10,.25);overflow:hidden;}
  .sim-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--surface-sunken);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .sim-body{padding:22px;}
  .sim-amount-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .sim-amount-row label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;}
  .sim-amount-wrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:7px;padding:7px 11px;background:var(--paper);}
  .sim-amount-wrap span{font-family:var(--font-mono);color:var(--text-faint);font-size:13px;}
  .sim-amount-wrap input{border:none;outline:none;font-family:var(--font-mono);font-size:14px;width:110px;color:var(--text);background:transparent;}
  .sim-range-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12.5px;color:var(--text);margin-bottom:8px;}
  .sim-range-label b{color:var(--gold);}
  .range-wrap{position:relative;height:34px;}
  .range-track-bg{position:absolute;top:15px;left:0;right:0;height:4px;background:var(--line);border-radius:4px;}
  .range-track-fill{position:absolute;top:15px;height:4px;background:var(--gold);border-radius:4px;}
  .range-wrap input[type=range]{
    position:absolute;top:0;left:0;width:100%;height:34px;margin:0;
    -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;
  }
  .range-wrap input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2.5px solid var(--gold);cursor:grab;margin-top:0;box-shadow:0 1px 3px rgba(0,0,0,.25);
    position:relative;top:8px;
  }
  .range-wrap input[type=range]::-moz-range-thumb{
    pointer-events:auto;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2.5px solid var(--gold);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .range-wrap input[type=range]::-webkit-slider-runnable-track{background:transparent;}
  .sim-results{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .sim-card{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--surface-sunken);}
  .sim-card-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .sim-card-value{margin-top:8px;font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--text);}
  .sim-card-sub{margin-top:4px;font-family:var(--font-mono);font-size:12px;}
  .sim-card-sub.pos{color:var(--gain);}
  .sim-card-sub.neg{color:var(--loss);}
  .sim-card.hero{background:var(--gold-fill);border-color:#e9cf94;}
  .sim-chart-wrap{margin-top:18px;}
  .sim-chart-wrap svg{width:100%;height:120px;display:block;}

  /* ==================== render helpers (shared) ==================== */

  function el(tag, cls, html){
    var d = document.createElement(tag);
    if(cls) d.className = cls;
    if(html !== undefined) d.innerHTML = html;
    return d;
  }
  function fmtPct(x, dp){ dp = dp==null?2:dp; return (x>=0?'+':'') + (x*100).toFixed(dp) + '%'; }
  function fmtINR(x){
    x = Math.round(x);
    var s = Math.abs(x).toString();
    var last3 = s.slice(-3), rest = s.slice(0,-3);
    if(rest) last3 = ',' + last3;
    var out = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
    return (x<0?'-':'') + '₹' + out;
  }

  function statTicker(stats){
    var wrap = el('div','stat-ticker');
    stats.forEach(function(s){
      var t = el('div','stat');
      t.appendChild(el('div','stat-val tnum '+(s.tone||'neutral'), s.v));
      t.appendChild(el('div','stat-lbl', s.l));
      wrap.appendChild(t);
    });
    return wrap;
  }

  function exhibitFrame(ex){
    var frame = el('div','exhibit-frame');
    var bar = el('div','exhibit-bar');
    var left = el('div','exhibit-bar-left');
    var kind = ex.kind || 'static';
    var dotClass = kind==='live' ? 'live' : kind==='restricted' ? 'restricted' : kind==='draft' ? 'draft' : 'static';

  function sparkline(series, tone){
    var pts = series.filter(function(p){ return p[1]!=null; });
    if(pts.length < 2) return '<svg viewBox="0 0 240 44"></svg>';
    var vals = pts.map(function(p){ return p[1]; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min -= 1; max += 1; }
    var W=240,H=44,pad=4;
    var stepX = (W-2*pad)/(pts.length-1);
    var coords = pts.map(function(p,i){
      var x = pad + i*stepX;
      var y = H - pad - ((p[1]-min)/(max-min))*(H-2*pad);
      return [x,y];
    });
    var path = coords.map(function(c,i){ return (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1); }).join(' ');
    var areaPath = path + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + (H-pad) + ' L' + coords[0][0].toFixed(1) + ',' + (H-pad) + ' Z';
    var colorVar = tone==='up' ? 'var(--gain)' : tone==='down' ? 'var(--loss)' : 'var(--slate)';
    var last = coords[coords.length-1];
    return '<svg viewBox="0 0 240 44" preserveAspectRatio="none">' +
      '<path d="'+areaPath+'" fill="'+colorVar+'" opacity="0.08" stroke="none"></path>' +
      '<path d="'+path+'" fill="none" stroke="'+colorVar+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>' +
      '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="'+colorVar+'"></circle>' +
      '</svg>';
  }

  }

    [['client','Client Portfolio',cardClient],['model','Fincart Optima',cardModel],['bse','BSE 500',cardBse]].forEach(function(t){
      t[2].appendChild(el('div','sim-card-label', t[1]));

      t[2].appendChild(el('div','sim-card-sub tnum','—'));
    });

    body.appendChild(results);

    var chartWrap = el('div','sim-chart-wrap');

    chartSvg.setAttribute('viewBox','0 0 900 120');
    chartSvg.setAttribute('preserveAspectRatio','none');

    col.appendChild(wrap);
    col.appendChild(el('div','exhibit-caption','Drag either handle — every card and the chart below recompute instantly against real weekly NAV data.'));

    var DATA = null;

    function fmtDate(d){
      var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var parts = d.split('-');
      return parts[2]+' '+months[parseInt(parts[1],10)-1]+' '+parts[0];
    }

    function render(){
      if(!DATA) return;
      var n = DATA.dates.length;
      var s = Math.min(parseInt(startInput.value,10), parseInt(endInput.value,10));
      var e = Math.max(parseInt(startInput.value,10), parseInt(endInput.value,10));
      if(e===s) e = Math.min(n-1, s+1);
      document.getElementById('simStartLbl').textContent = fmtDate(DATA.dates[s]);
      document.getElementById('simEndLbl').textContent = fmtDate(DATA.dates[e]);

      var pct0 = (s/(n-1))*100, pct1=(e/(n-1))*100;
      fillBar.style.left = pct0+'%'; fillBar.style.width = (pct1-pct0)+'%';

      var amount = parseFloat(amtInput.value)||0;

      [['client',cardClient],['model',cardModel],['bse',cardBse]].forEach(function(t){
        var series = DATA[t[0]];
        var v0 = series[s], v1 = series[e];
        var ratio = v1/v0;
        var endAmount = amount*ratio;
        var years = (new Date(DATA.dates[e]) - new Date(DATA.dates[s])) / (365.25*86400000);
        var cagr = years>0.08 ? (Math.pow(ratio, 1/years)-1) : (ratio-1);
        var valEl = t[1].querySelector('.sim-card-value');
        var subEl = t[1].querySelector('.sim-card-sub');
        valEl.textContent = fmtINR(endAmount);
        var gain = endAmount-amount;
        subEl.textContent = (gain>=0?'+':'-') + fmtINR(Math.abs(gain)).replace('₹','₹') + '  ·  CAGR ' + fmtPct(cagr,1);
        subEl.className = 'sim-card-sub tnum ' + (gain>=0?'pos':'neg');
      });

      // chart: three normalized lines over [s,e]
      var W=900,H=120,padL=0,padR=0,padT=8,padB=8;
      var seriesKeys=['client','model','bse'];
      var colors={client:'#8d8f87',model:'#96650f',bse:'#2c53c4'};
      var norm = {};
      var allVals = [];
      seriesKeys.forEach(function(k){
        var arr = DATA[k].slice(s,e+1);
        var base = arr[0];
        norm[k] = arr.map(function(v){ return v/base; });
        allVals = allVals.concat(norm[k]);
      });
      var min = Math.min.apply(null, allVals), max = Math.max.apply(null, allVals);
      if(min===max){min-=0.01;max+=0.01;}
      var count = norm.client.length;
      var stepX = count>1 ? (W-padL-padR)/(count-1) : 0;
      var svgParts = [];
      seriesKeys.forEach(function(k){
        var coords = norm[k].map(function(v,i){
          var x = padL + i*stepX;
          var y = H-padB - ((v-min)/(max-min))*(H-padT-padB);
          return x.toFixed(1)+','+y.toFixed(1);
        });
        var path = 'M'+coords.join(' L');
        var w = k==='model' ? 3 : 1.75;
        svgParts.push('<path d="'+path+'" fill="none" stroke="'+colors[k]+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"></path>');
      });
      chartSvg.innerHTML = svgParts.join('');
    }

    fetch(PERF_DATA_URL).then(function(r){ return r.json(); }).then(function(json){
      DATA = json;
      var n = DATA.dates.length-1;
      startInput.max = n; endInput.max = n;
      startInput.value = 0; endInput.value = n;
      render();
    }).catch(function(){
      wrap.querySelector('.sim-body').insertAdjacentHTML('afterbegin','<div class="cta-note warn">Performance data failed to load.</div>');
    });

    startInput.addEventListener('input', render);
    endInput.addEventListener('input', render);
    amtInput.addEventListener('input', render);

    return col;
  }

  /* ==================== shared mini bar chart ==================== */

  function renderMiniBars(svg, tip, wrap, items, colorFn){
    // items: [{label, value}], value already the number to plot
    var W=520,H=180,padB=34,padT=10,gap=10;
    var n = items.length;
    var barW = (W - gap*(n-1)) / n;
    var max = Math.max.apply(null, items.map(function(it){return it.value;})) || 1;
    var parts = [];
    items.forEach(function(it,i){
      var h = Math.max(2, (it.value/max) * (H-padT-padB));
      var x = i*(barW+gap);
      var y = H-padB-h;
      var color = colorFn ? colorFn(it,i) : 'var(--gold)';
      parts.push('<g class="miniapp-bar-group" data-i="'+i+'">' +
        '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+color+'"></rect>' +
        '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-padB+16).toFixed(1)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--text-faint)">'+it.label+'</text>' +
        '</g>');
    });
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML = parts.join('');

    svg.querySelectorAll('.miniapp-bar-group').forEach(function(g){
      g.addEventListener('mousemove', function(e){
        var i = parseInt(g.getAttribute('data-i'),10);
        var it = items[i];
        var wrapRect = wrap.getBoundingClientRect();
        tip.style.left = (e.clientX - wrapRect.left) + 'px';
        tip.style.top = (e.clientY - wrapRect.top) + 'px';
        tip.textContent = it.label + ': ' + it.tipText;
        tip.style.opacity = 1;
      });
      g.addEventListener('mouseleave', function(){ tip.style.opacity = 0; });
    });
  }

  function renderTable(columns, rows, totalRowIdx){

    rows.forEach(function(r, i){

      if(i === totalRowIdx) tr.className = 'total-row';
      r.forEach(function(cell){ tr.appendChild(el('td','', String(cell))); });

    col.appendChild(el('div','exhibit-caption','Nine teams, mapped-client totals vs. conversions — the same table the live dashboard\'s "By Team" section draws.'));

    var raw = [
      {label:'Ratan P', total:299, conv:81}, {label:'Akanksha', total:259, conv:61}, {label:'SV', total:208, conv:0},
      {label:'Vivek S', total:208, conv:64}, {label:'Ankit S', total:197, conv:66}, {label:'Anmol G', total:187, conv:30},
      {label:'Yash T', total:131, conv:34}, {label:'Ravi S', total:74, conv:10}, {label:'Vidhi', total:65, conv:23}
    ];

    function draw(mode){
      var items = raw.map(function(x){
        if(mode==='conv'){
          return {label:x.label, value:x.conv, tipText: x.conv.toLocaleString()+' converted'};
        }
        return {label:x.label, value:x.total, tipText: x.total.toLocaleString()+' clients'};
      });
      renderMiniBars(svg, tip, chartWrap, items, function(){ return mode==='conv' ? 'var(--gain)' : 'var(--gold)'; });
    }
    draw('total');
    btnClients.addEventListener('click', function(){ btnClients.classList.add('active'); btnConv.classList.remove('active'); draw('total'); });
    btnConv.addEventListener('click', function(){ btnConv.classList.add('active'); btnClients.classList.remove('active'); draw('conv'); });

    return col;
  }

  /* ==================== slide 13: animated walkthrough ==================== */

  function buildWalkthrough(cfg){
    var col = el('div','exhibit-col');

    var stage = el('div','walkthrough-stage');
    stage.innerHTML = cfg.scenes.map(function(html, i){
      return '<div class="wt-scene wt-'+(i+1)+'"><div class="wt-card">'+html+'</div></div>';
    }).join('');
    frame.appendChild(stage);

    frame.appendChild(el('div','walkthrough-progress'));
    frame.appendChild(el('div','walkthrough-caption', cfg.caption));

    col.appendChild(frame);
    return col;
  }

  var WALKTHROUGHS = {

  /* ==================== generic page builder ==================== */

  function buildPage(slide, idx){
    var page = el('section','page'+(idx%2===1?' flip':''));
    page.id = 'p'+slide.n;
    page.setAttribute('data-idx', idx);
    page.setAttribute('data-name', 'Entry '+String(slide.n).padStart(2,'0'));

    var inner = el('div','page-inner');

    var eyebrowRow = el('div','eyebrow-row');
    eyebrowRow.appendChild(el('span','status-dot '+GROUPS[slide.group].dot));
    eyebrowRow.appendChild(el('span','eyebrow','Ledger entry '+String(slide.n).padStart(2,'0')+' &middot; '+GROUPS[slide.group].label));
    inner.appendChild(eyebrowRow);

    inner.appendChild(el('h2','headline', slide.headline));
    inner.appendChild(el('p','lede', slide.lede));

    if(slide.kind === 'macro'){
      var soloWrap = el('div',''); soloWrap.style.marginTop='36px';
      soloWrap.appendChild(buildMacro());
      inner.appendChild(soloWrap);
      page.appendChild(inner);
      return page;
    }

    if(slide.kind === 'fund-sim'){
      var body0 = el('div','page-body');
      body0.style.gridTemplateColumns = '1fr';
      body0.appendChild(buildFundSim(slide));
      inner.appendChild(body0);
      page.appendChild(inner);
      return page;
    }

    if(slide.kind === 'invest-sim'){
      var body1 = el('div','page-body');
      body1.style.gridTemplateColumns = '1fr';
      body1.appendChild(buildInvestSim());
      inner.appendChild(body1);
      page.appendChild(inner);
      return page;
    }

    if(slide.kind === 'simple'){
      var exColS = el('div','exhibit-col');
      exColS.style.maxWidth = '420px';
      exColS.style.margin = '40px auto 0';
      exColS.appendChild(exhibitFrame(slide.exhibit));
      inner.appendChild(exColS);
      page.appendChild(inner);
      return page;
    }

    // standard
    var body = el('div','page-body');
    var narrative = el('div','narrative');
    var beatsWrap = el('div','beats');
    slide.beats.forEach(function(b){
      var beat = el('div','beat');
      beat.appendChild(el('span','beat-mark'));
      beat.appendChild(el('div','beat-label', b.label));
      beat.appendChild(el('p','', b.text));
      beatsWrap.appendChild(beat);
    });
    narrative.appendChild(beatsWrap);
    if(!slide.liveread && !slide.metric) narrative.appendChild(statTicker(slide.stats));
    if(slide.demo || slide.attachment) narrative.appendChild(ctaRow(slide.demo, slide.attachment));
    body.appendChild(narrative);

    var hasExhibit = !!(slide.exhibits || slide.diagram || slide.metric || slide.liveread || slide.miniapp || slide.walkthrough);
    if(hasExhibit){
      var exCol2 = el('div','exhibit-col');
      if(slide.exhibits){
        var group = el('div','exhibit-group'+(slide.exhibits.length>1?' pair':''));
        slide.exhibits.forEach(function(ex){ group.appendChild(exhibitFrame(ex)); });
        exCol2.appendChild(group);
      } else if(slide.diagram){
        exCol2.appendChild(diagramExhibit(slide.diagram));
      } else if(slide.metric){
        exCol2.appendChild(metricExhibit(slide.metric));
      } else if(slide.liveread){
        exCol2.appendChild(liveReadExhibit(slide.stats));
      } else if(slide.miniapp === 'marketing'){
        exCol2.appendChild(buildMarketingMini());
      } else if(slide.miniapp === 'revenue'){
        exCol2.appendChild(buildRevenueMini());
      } else if(slide.miniapp === 'lnd'){
        exCol2.appendChild(buildLndMini());
      }
      if(slide.walkthrough){
        exCol2.appendChild(buildWalkthrough(WALKTHROUGHS[slide.walkthrough]));
      }
      body.appendChild(exCol2);
    } else {
      body.style.gridTemplateColumns = '1fr';
      narrative.style.maxWidth = '640px';
    }

    inner.appendChild(body);
    page.appendChild(inner);
    return page;
  }

  function buildClosing(){
    var page = el('section','page closing');
    page.id = 'pclose';
    page.setAttribute('data-idx', SLIDES.length);
    page.setAttribute('data-name','Closing');
    var inner = el('div','page-inner');
    inner.appendChild(el('div','eyebrow-row','<span class="eyebrow">Closing entry</span>'));
    inner.appendChild(el('h2','', 'Sixteen systems. One year. Still building.'));
    inner.appendChild(el('p','closing-lede','Quant models, live dashboards, ops automation — every one turns a manual, error-prone process into a single click. Entry 14 is already the next chapter: off spreadsheets, into the product.'));
    inner.appendChild(statTicker([
      {v:'16', l:'tools & systems shipped', tone:'gold'},
      {v:'4,000+', l:'funds screened by the model', tone:'neutral'},
      {v:'6', l:'live dashboards in production', tone:'gain'},
      {v:'22,523', l:'transactions auto-flagged, one run', tone:'gold'}
    ]));
    var foot = el('div','closing-foot');
    foot.appendChild(el('span','','Prepared by Dev Singhal'));
    foot.appendChild(el('span','','Fincart Optima &middot; Build Log'));
    inner.appendChild(foot);
    page.appendChild(inner);
    return page;
  }

  /* ==================== assemble ==================== */

  var deck = document.getElementById('deck');
  var pages = [];
  SLIDES.forEach(function(s,i){ var p = buildPage(s,i); deck.appendChild(p); pages.push(p); });
  var closePage = buildClosing();
  deck.appendChild(closePage); pages.push(closePage);

  /* ledger nav */
  var ledgerScroll = document.getElementById('ledgerScroll');
  var navLinks = [];

  var currentGroup = null, currentList = null;
  SLIDES.forEach(function(s, i){
    if(s.group !== currentGroup){
      currentGroup = s.group;
      ledgerScroll.appendChild(el('div','ledger-act', GROUPS[s.group].label));
      currentList = el('ul','ledger-list');
      ledgerScroll.appendChild(currentList);
    }
    var li = el('li','ledger-item');
    var a = el('a','ledger-link');
    a.appendChild(el('span','ledger-idx mono', String(s.n).padStart(2,'0')));
    a.appendChild(el('span','', s.tag));
    (function(idx){ a.addEventListener('click', function(){ goTo(idx); }); })(i);
    li.appendChild(a);
    currentList.appendChild(li);
    navLinks.push(li);
  });

  var closeLi = el('li','ledger-item');
  var closeA = el('a','ledger-link');
  closeA.appendChild(el('span','ledger-idx mono','&#8226;'));
  closeA.appendChild(el('span','','Closing'));
  closeA.addEventListener('click', function(){ goTo(pages.length-1); });
  closeLi.appendChild(closeA);
  var closeList = el('ul','ledger-list');
  closeList.appendChild(closeLi);
  ledgerScroll.appendChild(closeList);
  navLinks.push(closeLi);

  /* ---------------- interactivity ---------------- */

  var progLabel = document.getElementById('progLabel');
  var progName = document.getElementById('progName');
  var progFill = document.getElementById('progFill');
  var fnCount = document.getElementById('fnCount');
  var activeIdx = -1;
  var settingActive = false;

  function setActive(idx){
    if(settingActive || idx === activeIdx) return;
    settingActive = true;
    activeIdx = idx;
    navLinks.forEach(function(li,i){ li.classList.toggle('active', i===idx); });
    var active = navLinks[idx];
    if(active && typeof active.scrollIntoView === 'function'){
      active.scrollIntoView({block:'nearest'});
    }
    progLabel.textContent = String(idx).padStart(2,'0')+' / '+String(pages.length-1).padStart(2,'0');
    progName.textContent = pages[idx].getAttribute('data-name');
    progFill.style.width = (idx/(pages.length-1)*100)+'%';
    fnCount.textContent = String(idx).padStart(2,'0');
    settingActive = false;
  }

  function goTo(idx){
    idx = Math.max(0, Math.min(pages.length-1, idx));
    pages[idx].scrollIntoView({behavior:'smooth', block:'start'});
  }

  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && entry.intersectionRatio > 0.5){
        var idx = parseInt(entry.target.getAttribute('data-idx'),10);
        setActive(idx);
      }
    });
  }, {root: document.getElementById('deck'), threshold:[0.5]});
  pages.forEach(function(p){ observer.observe(p); });

  document.getElementById('fnPrev').addEventListener('click', function(){ goTo(activeIdx-1); });
  document.getElementById('fnNext').addEventListener('click', function(){ goTo(activeIdx+1); });

  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowDown' || e.key==='PageDown'){ e.preventDefault(); goTo(activeIdx+1); }
    else if(e.key==='ArrowUp' || e.key==='PageUp'){ e.preventDefault(); goTo(activeIdx-1); }
  });

  /* mobile drawer */
  var ledger = document.getElementById('ledger');
  var navToggle = document.getElementById('navToggle');
  navToggle.addEventListener('click', function(){ ledger.classList.toggle('open'); });
  navLinks.forEach(function(li){
    li.querySelector('a').addEventListener('click', function(){ ledger.classList.remove('open'); });
  });

  /* lightbox */
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  function openLightbox(src, alt){ lightboxImg.src = src; lightboxImg.alt = alt; lightbox.classList.add('open'); }
  function closeLightbox(){ lightbox.classList.remove('open'); lightboxImg.src=''; }
  lightbox.addEventListener('click', closeLightbox);
  document.getElementById('lightboxClose').addEventListener('click', function(e){ e.stopPropagation(); closeLightbox(); });

  /* pdf modal */
  var pdfModal = document.getElementById('pdfModal');
  var pdfFrame = document.getElementById('pdfModalFrame');
  var pdfTitle = document.getElementById('pdfModalTitle');
  var pdfOpen = document.getElementById('pdfModalOpen');
  window.openPdfModal = function(url, label){
    pdfFrame.src = url;
    pdfTitle.textContent = label || 'Attachment';
    pdfOpen.href = url;
    pdfModal.classList.add('open');
  };
  function closePdfModal(){ pdfModal.classList.remove('open'); pdfFrame.src=''; }
  document.getElementById('pdfModalClose').addEventListener('click', closePdfModal);
  pdfModal.addEventListener('click', function(e){ if(e.target===pdfModal) closePdfModal(); });

  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeLightbox(); closePdfModal(); } });

  setActive(0);

})();
</script>
